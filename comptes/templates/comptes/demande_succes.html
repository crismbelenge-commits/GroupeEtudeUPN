<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande envoyée — Groupe Étude UPN</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Police Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .success-container {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .success-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            text-align: center;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem auto;
        }

        .success-title {
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .success-text {
            font-size: 0.9375rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: 0.625rem;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-sizing: border-box;
        }

        .btn-home:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <!-- Icône de validation moderne -->
            <div class="icon-wrapper">
                ✓
            </div>

            <h1 class="success-title">Demande envoyée !</h1>
            <p class="success-text">
                Votre demande d'inscription a bien été enregistrée. Un administrateur la validera prochainement.
            </p>

            <a href="{% url 'comptes:demander_inscription' %}" class="btn-home">
                Retour au formulaire
            </a>
        </div>

        <div class="footer-text">
            Groupe Étude UPN — L2 Informatique
        </div>
    </div>
</body>
</html>
