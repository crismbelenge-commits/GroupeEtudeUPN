{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Adhésion — Amis du Savoir L2 GI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'comptes/css/style.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-pro p-4 bg-white border-0 shadow-sm">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Demande d'Adhésion</h3>
                        <p class="text-muted small">Amis du Savoir — <span style="color: #4f46e5;">L2 Gestion Informatique</span></p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nom" class="form-label small fw-semibold">Nom complet</label>
                            <input type="text" name="nom" id="nom" class="form-control" placeholder="Entrez votre nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Adresse Email</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="nom@example.com" required>
                        </div>
                        <button type="submit" class="btn btn-indigo w-100 py-2 fw-semibold mb-3">Soumettre ma demande</button>
                    </form>

                    <div class="text-center">
                        <a href="{% url 'comptes:accueil' %}" class="text-muted small text-decoration-none">← Retour à l'accueil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
