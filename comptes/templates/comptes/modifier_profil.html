<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier mon profil — Groupe Étude UPN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { border: none; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); background: #ffffff; width: 100%; max-width: 450px; padding: 2rem; }
    </style>
</head>
<body>
    <div class="card card-custom">
        <h4 class="fw-bold mb-3">Modifier mon profil</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Nom complet / Prénom</label>
                {{ form.first_name }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Adresse Email</label>
                {{ form.email }}
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <a href="{% url 'comptes:tableau_de_bord' %}" class="text-decoration-none text-muted small">Annuler</a>
                <button type="submit" class="btn btn-primary px-4">Enregistrer</button>
            </div>
        </form>
    </div>
</body>
</html>
